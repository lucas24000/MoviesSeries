<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E0C11">
<title>Ciné-Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0C11;
    --bg-alt:#151119;
    --card:#1D1822;
    --card-edge:#0E0C11;
    --gold:#E8B23E;
    --gold-dim:#8a6a26;
    --teal:#4FD1C5;
    --teal-dim:#2c766f;
    --text:#F3EFE7;
    --muted:#8D8796;
    --danger:#E2604F;
    --border:#2C2733;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Work Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  body{
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(232,178,62,0.06), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(79,209,197,0.05), transparent 40%);
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 18px 100px;}

  header{
    padding:28px 0 18px;
    text-align:center;
    position:relative;
  }
  .settings-btn{
    position:absolute; top:22px; right:0;
    background:none;border:1px solid var(--border);border-radius:999px;
    width:34px;height:34px;color:var(--muted);font-size:1rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .bulbs{display:flex;justify-content:center;gap:7px;margin-bottom:14px;}
  .bulb{width:5px;height:5px;border-radius:50%;background:var(--gold-dim);}
  .bulb.on{background:var(--gold);box-shadow:0 0 6px 1px rgba(232,178,62,0.7);animation:twinkle 2.6s ease-in-out infinite;}
  .bulb:nth-child(2n).on{animation-delay:0.4s;}
  .bulb:nth-child(3n).on{animation-delay:0.9s;}
  @keyframes twinkle{0%,100%{opacity:1;}50%{opacity:0.35;}}
  h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:2.6rem;
    letter-spacing:0.09em;
    margin:0;
    color:var(--gold);
    text-shadow:0 0 22px rgba(232,178,62,0.25);
  }
  .sub{color:var(--muted);font-size:0.82rem;margin-top:4px;letter-spacing:0.02em;}

  .tabs{display:flex;gap:8px;margin:18px 0 12px;overflow-x:auto;padding-bottom:2px;}
  .tab{
    flex:none;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--bg-alt);
    color:var(--muted);
    font-size:0.82rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{border-color:var(--gold);color:var(--gold);background:rgba(232,178,62,0.08);}
  .tab.active[data-accent="serie"]{border-color:var(--teal);color:var(--teal);background:rgba(79,209,197,0.08);}

  .add-btn{
    width:100%;
    padding:13px;
    margin:6px 0 20px;
    border-radius:12px;
    border:1px dashed var(--border);
    background:transparent;
    color:var(--muted);
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:0.9rem;
    cursor:pointer;
    letter-spacing:0.02em;
  }
  .add-btn:active{border-color:var(--gold);color:var(--gold);}
  .add-btn:focus-visible, .tab:focus-visible, .icon-btn:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible{
    outline:2px solid var(--gold); outline-offset:2px;
  }

  .ticket{
    display:flex;
    background:var(--card);
    border-radius:14px;
    margin-bottom:14px;
    overflow:hidden;
    border:1px solid var(--border);
    position:relative;
    animation:rise 0.35s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .ticket .stripe{width:5px;flex:none;background:var(--gold);}
  .ticket.serie .stripe{background:var(--teal);}
  .ticket-body{flex:1;padding:14px 12px;min-width:0;}
  .ticket-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .ticket-title{font-weight:700;font-size:1rem;line-height:1.25;word-break:break-word;}
  .ticket-meta{color:var(--muted);font-size:0.76rem;margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .type-badge{
    text-transform:uppercase;font-size:0.65rem;letter-spacing:0.06em;font-weight:700;
    color:var(--gold);
  }
  .ticket.serie .type-badge{color:var(--teal);}
  .extra-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;}
  .xbadge{
    font-size:0.68rem;font-weight:600;padding:2px 7px;border-radius:6px;
    border:1px solid var(--border);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:4px;
  }
  .xbadge.cinema{color:var(--gold);border-color:var(--gold-dim);}
  .ticket.serie .xbadge.cinema{color:var(--teal);border-color:var(--teal-dim);}
  .xbadge.format{color:var(--text);background:rgba(255,255,255,0.03);}
  .poster-thumb{
    width:44px;height:66px;flex:none;border-radius:6px;object-fit:cover;
    background:var(--bg-alt);border:1px solid var(--border);
  }
  .ticket-top{gap:10px;}
  .overview{
    font-size:0.74rem;color:var(--muted);margin-top:6px;line-height:1.42;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .crew-line{font-size:0.72rem;color:var(--muted);margin-top:4px;}
  .crew-line b{color:var(--text);font-weight:600;}

  .perf{
    width:1px;
    flex:none;
    background-image:linear-gradient(var(--border) 60%, transparent 0%);
    background-position:left;
    background-size:1px 8px;
    background-repeat:repeat-y;
    position:relative;
  }
  .perf::before, .perf::after{
    content:"";
    position:absolute; left:-6px;
    width:12px;height:12px;border-radius:50%;
    background:var(--bg);
  }
  .perf::before{top:-6px;}
  .perf::after{bottom:-6px;}

  .ticket-right{
    flex:none;width:96px;
    padding:14px 10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  }
  .stars{font-size:0.9rem;color:var(--gold);letter-spacing:1px;}
  .ticket.serie .stars{color:var(--teal);}
  .status-pill{
    font-size:0.68rem;font-weight:600;padding:3px 8px;border-radius:999px;
    border:1px solid var(--border);color:var(--muted);white-space:nowrap;
  }
  .status-pill.en_cours{color:var(--gold);border-color:var(--gold-dim);}
  .ticket.serie .status-pill.en_cours{color:var(--teal);border-color:var(--teal-dim);}
  .status-pill.termine{color:var(--text);border-color:var(--border);background:rgba(255,255,255,0.03);}

  .ticket-actions{display:flex;gap:10px;margin-top:8px;}
  .icon-btn{
    background:none;border:none;color:var(--muted);font-size:0.72rem;cursor:pointer;padding:2px;font-family:inherit;
  }
  .icon-btn.danger:active{color:var(--danger);}

  .empty{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty .reel{font-size:2.2rem;margin-bottom:10px;opacity:0.6;}
  .empty p{font-size:0.88rem;line-height:1.5;max-width:280px;margin:0 auto;}

  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(2px);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  .sheet{
    width:100%;max-width:520px;background:var(--bg-alt);
    border-radius:20px 20px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border);
    animation:slideup 0.25s ease both;
  }
  @keyframes slideup{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet h2{font-family:'Bebas Neue',sans-serif;letter-spacing:0.05em;font-size:1.4rem;margin:0 0 16px;color:var(--gold);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:0.75rem;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:0.03em;}
  .field input[type="text"], .field input[type="date"], .field select{
    width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:0.92rem;font-family:'Work Sans',sans-serif;
  }
  .seg{display:flex;gap:8px;}
  .seg button{
    flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card);
    color:var(--muted);font-weight:600;font-size:0.85rem;cursor:pointer;font-family:inherit;
  }
  .seg button.sel[data-t="film"]{border-color:var(--gold);color:var(--gold);background:rgba(232,178,62,0.08);}
  .seg button.sel[data-t="serie"]{border-color:var(--teal);color:var(--teal);background:rgba(79,209,197,0.08);}
  .rate-row{display:flex;gap:6px;}
  .rate-row button{background:none;border:none;font-size:1.5rem;color:var(--border);cursor:pointer;padding:0;line-height:1;}
  .rate-row button.filled{color:var(--gold);}
  .film-only{display:none;}
  .film-only.show{display:block;}
  .serie-only{display:none;}
  .serie-only.show{display:block;}
  .season-block{
    border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--card);
  }
  .season-head{
    display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px;
    font-size:0.8rem;font-weight:600;
  }
  .season-head-actions{display:flex;gap:10px;align-items:center;flex:none;}
  .mini-link{
    background:none;border:none;color:var(--muted);font-size:0.68rem;text-decoration:underline;
    cursor:pointer;font-family:inherit;padding:0;white-space:nowrap;
  }
  .mini-link.danger{color:var(--danger);text-decoration:none;font-size:0.9rem;font-weight:700;line-height:1;}
  .ep-grid{display:flex;flex-wrap:wrap;gap:6px;}
  .ep-check{
    width:30px;height:30px;border-radius:7px;border:1.5px solid var(--danger);background:rgba(226,96,79,0.12);
    color:var(--danger);font-size:0.72rem;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .ep-check.on{background:#3ECB78;border-color:#3ECB78;color:#0B2B16;}
  .add-season-row{display:flex;gap:8px;margin-top:4px;}
  .add-season-row input{
    flex:1;min-width:0;padding:9px 10px;border-radius:8px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:0.82rem;font-family:inherit;
  }
  .add-season-row button{
    flex:none;padding:9px 12px;border-radius:8px;border:1px solid var(--gold-dim);
    background:transparent;color:var(--gold);font-size:0.8rem;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .seasons-empty{font-size:0.76rem;color:var(--muted);margin-bottom:8px;}
  .search-wrap{position:relative;}
  .search-results{
    position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    max-height:260px;overflow-y:auto;
  }
  .sr-item{
    display:flex;gap:10px;padding:8px 10px;align-items:center;cursor:pointer;
    border-bottom:1px solid var(--border);
  }
  .sr-item:last-child{border-bottom:none;}
  .sr-item:active{background:var(--bg-alt);}
  .sr-item img{width:32px;height:48px;object-fit:cover;border-radius:4px;background:var(--bg-alt);flex:none;}
  .sr-item .sr-t{font-size:0.85rem;font-weight:600;}
  .sr-item .sr-y{font-size:0.72rem;color:var(--muted);}
  .sr-empty{padding:12px;font-size:0.78rem;color:var(--muted);text-align:center;}
  .tmdb-note{font-size:0.72rem;color:var(--muted);margin-top:6px;line-height:1.4;}
  .tmdb-note a{color:var(--gold);}
  .selected-preview{
    display:flex;gap:10px;padding:10px;border-radius:10px;border:1px solid var(--gold-dim);
    background:rgba(232,178,62,0.06);margin-top:10px;align-items:flex-start;
  }
  .selected-preview img{width:40px;height:60px;object-fit:cover;border-radius:5px;flex:none;}
  .selected-preview .sp-text{font-size:0.72rem;color:var(--muted);line-height:1.4;}
  .selected-preview .sp-text b{color:var(--text);}
  .clear-sel{background:none;border:none;color:var(--muted);font-size:0.7rem;text-decoration:underline;cursor:pointer;margin-top:4px;font-family:inherit;}
  .switch-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);
  }
  .switch-row span{font-size:0.88rem;}
  .switch{
    width:42px;height:24px;border-radius:999px;background:var(--border);position:relative;
    border:none;cursor:pointer;flex:none;transition:background 0.15s;
  }
  .switch::after{
    content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
    background:var(--text);transition:transform 0.15s;
  }
  .switch.on{background:var(--gold);}
  .switch.on::after{transform:translateX(18px);}
  .sheet-actions{display:flex;gap:10px;margin-top:18px;}
  .btn{
    flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;font-size:0.9rem;cursor:pointer;font-family:inherit;
  }
  .btn.primary{background:var(--gold);color:#1A1400;}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}

  .footer-link{
    display:block;text-align:center;color:var(--muted);font-size:0.72rem;margin-top:26px;
    text-decoration:underline;background:none;border:none;cursor:pointer;width:100%;font-family:inherit;
  }
  .loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:0.85rem;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="settings-btn" id="openSettings" aria-label="Réglages TMDB">⚙</button>
    <div class="bulbs" id="bulbs"></div>
    <h1>CINÉ-JOURNAL</h1>
    <div class="sub">Tout ce que tu as vu, en un coup d'œil</div>
  </header>

  <div class="tabs" id="typeTabs">
    <button class="tab active" data-type="all">Tous</button>
    <button class="tab" data-type="film" data-accent="film">Films</button>
    <button class="tab" data-type="serie" data-accent="serie">Séries</button>
  </div>
  <div class="tabs" id="statusTabs">
    <button class="tab active" data-status="all">Tout statut</button>
    <button class="tab" data-status="a_voir">À voir</button>
    <button class="tab" data-status="en_cours">En cours</button>
    <button class="tab" data-status="termine">Terminé</button>
  </div>

  <button class="add-btn" id="openAdd">+ Ajouter un titre</button>

  <div id="list"><div class="loading">Chargement…</div></div>

  <button class="footer-link" id="resetBtn">Réinitialiser toute ma collection</button>
  <div class="tmdb-note" id="syncStatus" style="text-align:center;margin-top:8px;"></div>
</div>

<div id="modalRoot"></div>

<script>
(function(){
  const bulbsEl = document.getElementById('bulbs');
  for(let i=0;i<11;i++){
    const b=document.createElement('div');
    b.className='bulb'+(i%2===0?' on':'');
    bulbsEl.appendChild(b);
  }

  const STORAGE_KEY = 'entries';
  const API_KEY_STORAGE = 'tmdb_api_key';
  const TMDB_IMG = 'https://image.tmdb.org/t/p/w185';
  let entries = [];
  let tmdbApiKey = '';
  let filterType = 'all';
  let filterStatus = 'all';
  let editingId = null;

  const GH_KEYS = {token:'gh_token', repo:'gh_repo', path:'gh_path', sha:'gh_sha'};
  let gh = {token:'', repo:'', path:'data/entries.json', sha:null};

  function loadGhConfig(){
    gh.token = localStorage.getItem(GH_KEYS.token) || '';
    gh.repo = localStorage.getItem(GH_KEYS.repo) || '';
    gh.path = localStorage.getItem(GH_KEYS.path) || 'data/entries.json';
    gh.sha = localStorage.getItem(GH_KEYS.sha) || null;
  }
  function ghConfigured(){ return !!(gh.token && gh.repo && gh.path); }

  function utf8ToB64(str){ return btoa(unescape(encodeURIComponent(str))); }
  function b64ToUtf8(str){ return decodeURIComponent(escape(atob(str))); }

  function setSyncStatus(text){
    const el = document.getElementById('syncStatus');
    if(el) el.textContent = text;
  }

  async function pullFromGitHub(){
    if(!ghConfigured()) return false;
    try{
      setSyncStatus('Synchronisation avec GitHub…');
      const url = `https://api.github.com/repos/${gh.repo}/contents/${gh.path.split('/').map(encodeURIComponent).join('/')}`;
      const res = await fetch(url, {headers:{Authorization:`Bearer ${gh.token}`, Accept:'application/vnd.github+json'}});
      if(res.status===404){
        gh.sha = null;
        setSyncStatus('Aucune sauvegarde GitHub existante — la prochaine modif en créera une.');
        return false;
      }
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      gh.sha = data.sha;
      localStorage.setItem(GH_KEYS.sha, gh.sha);
      const content = b64ToUtf8(data.content.replace(/\n/g,''));
      const remote = JSON.parse(content);
      entries = remote;
      localStorage.setItem(STORAGE_KEY, content);
      setSyncStatus('✓ Synchronisé avec GitHub');
      return true;
    }catch(e){
      console.error('GitHub pull error', e);
      setSyncStatus('⚠ Impossible de récupérer depuis GitHub (vérifie tes réglages)');
      return false;
    }
  }

  async function pushToGitHub(){
    if(!ghConfigured()) return false;
    try{
      setSyncStatus('Sauvegarde sur GitHub…');
      const url = `https://api.github.com/repos/${gh.repo}/contents/${gh.path.split('/').map(encodeURIComponent).join('/')}`;
      const body = {
        message: 'Mise à jour Ciné-Journal',
        content: utf8ToB64(JSON.stringify(entries, null, 2))
      };
      if(gh.sha) body.sha = gh.sha;
      const res = await fetch(url, {
        method:'PUT',
        headers:{Authorization:`Bearer ${gh.token}`, Accept:'application/vnd.github+json', 'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      if(!res.ok){
        const errData = await res.json().catch(()=>({}));
        if(res.status===409){
          setSyncStatus('⚠ Conflit détecté, nouvelle tentative…');
          const pulled = await pullFromGitHub();
          if(pulled) return await pushToGitHub();
        }
        throw new Error(errData.message || ('HTTP '+res.status));
      }
      const data = await res.json();
      gh.sha = data.content.sha;
      localStorage.setItem(GH_KEYS.sha, gh.sha);
      setSyncStatus('✓ Sauvegardé sur GitHub');
      return true;
    }catch(e){
      console.error('GitHub push error', e);
      setSyncStatus('⚠ Échec de la sauvegarde GitHub (vérifie ton token et le nom du dépôt)');
      return false;
    }
  }

  const listEl = document.getElementById('list');
  const modalRoot = document.getElementById('modalRoot');

  async function loadEntries(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      entries = raw ? JSON.parse(raw) : [];
    }catch(e){
      entries = [];
    }
    try{
      tmdbApiKey = localStorage.getItem(API_KEY_STORAGE) || '';
    }catch(e){
      tmdbApiKey = '';
    }
    loadGhConfig();
    render();
    if(ghConfigured()){
      const ok = await pullFromGitHub();
      if(ok) render();
    }
  }

  function openSettings(){
    modalRoot.innerHTML = `
      <div class="overlay" id="overlay">
        <div class="sheet">
          <h2>Réglages</h2>
          <div class="field">
            <label>Clé API TMDB (v3)</label>
            <input type="text" id="s_key" value="${escapeHtml(tmdbApiKey)}" placeholder="Colle ta clé ici" />
          </div>
          <div class="tmdb-note">
            Gratuite : crée un compte sur themoviedb.org, puis va dans Paramètres → API pour générer une clé "API Key (v3 auth)". Elle est stockée uniquement sur cet appareil.
          </div>
          <div class="field" style="margin-top:18px;">
            <label>Sauvegarde sur GitHub (optionnel)</label>
            <input type="text" id="s_gh_token" value="${escapeHtml(gh.token)}" placeholder="Token d'accès personnel (PAT)" style="margin-bottom:8px;" />
            <input type="text" id="s_gh_repo" value="${escapeHtml(gh.repo)}" placeholder="Dépôt, ex : tonpseudo/cine-journal" style="margin-bottom:8px;" />
            <input type="text" id="s_gh_path" value="${escapeHtml(gh.path)}" placeholder="Chemin du fichier (ex: data/entries.json)" />
          </div>
          <div class="tmdb-note">
            Crée un token sur github.com → Settings → Developer settings → Personal access tokens → Fine-grained tokens, avec l'accès "Contents: Read and write" limité à ce dépôt uniquement. Une fois configuré, chaque ajout/modif est automatiquement sauvegardé dans ton dépôt (branche "main"). Le token est stocké uniquement sur cet appareil.
          </div>
          <div class="sheet-actions">
            <button class="btn ghost" id="s_cancel">Annuler</button>
            <button class="btn primary" id="s_save">Enregistrer</button>
          </div>
        </div>
      </div>
    `;
    modalRoot.querySelector('#s_cancel').addEventListener('click', closeModal);
    modalRoot.querySelector('#overlay').addEventListener('click', (ev)=>{ if(ev.target.id==='overlay') closeModal(); });
    modalRoot.querySelector('#s_save').addEventListener('click', async ()=>{
      tmdbApiKey = modalRoot.querySelector('#s_key').value.trim();
      try{ localStorage.setItem(API_KEY_STORAGE, tmdbApiKey); }catch(e){ console.error(e); }

      gh.token = modalRoot.querySelector('#s_gh_token').value.trim();
      gh.repo = modalRoot.querySelector('#s_gh_repo').value.trim();
      gh.path = modalRoot.querySelector('#s_gh_path').value.trim() || 'data/entries.json';
      localStorage.setItem(GH_KEYS.token, gh.token);
      localStorage.setItem(GH_KEYS.repo, gh.repo);
      localStorage.setItem(GH_KEYS.path, gh.path);
      closeModal();

      if(ghConfigured()){
        const ok = await pullFromGitHub();
        if(!ok && ghConfigured()){
          await pushToGitHub();
        }
        render();
      }
    });
  }
  document.getElementById('openSettings').addEventListener('click', openSettings);

  async function saveEntries(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }catch(e){
      console.error('Erreur de stockage', e);
    }
    if(ghConfigured()){
      await pushToGitHub();
    }
  }

  function uid(){ return 'e_'+Date.now()+'_'+Math.random().toString(36).slice(2,8); }

  function statusLabel(s){
    return s==='a_voir' ? 'À voir' : s==='en_cours' ? 'En cours' : 'Terminé';
  }

  function formatLabel(f){
    return f==='dvd' ? '📀 DVD' : f==='bluray' ? '📀 Blu-ray' : f==='4k' ? '📀 4K UHD' : '';
  }

  function seasonsSummary(seasons){
    if(!seasons || seasons.length===0) return '';
    let totalEp=0, totalWatched=0, next=null;
    [...seasons].sort((a,b)=>a.number-b.number).forEach(s=>{
      totalEp += s.episodeCount;
      s.watched.forEach((w,i)=>{
        if(w) totalWatched++;
        else if(!next) next = {season:s.number, ep:i+1};
      });
    });
    if(totalEp===0) return '';
    let text = `${totalWatched}/${totalEp} épisodes vus`;
    if(next) text += ` · suite : S${next.season}E${next.ep}`;
    else text += ` · terminée`;
    return text;
  }

  function stars(n){
    let out='';
    for(let i=1;i<=5;i++) out += i<=n ? '★' : '☆';
    return out;
  }

  function fmtDate(d){
    if(!d) return '';
    const parts = d.split('-');
    if(parts.length!==3) return d;
    const months=['jan.','fév.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
    return `${parseInt(parts[2],10)} ${months[parseInt(parts[1],10)-1]} ${parts[0]}`;
  }

  function render(){
    listEl.innerHTML = '';
    const filtered = entries.filter(e=>{
      if(filterType!=='all' && e.type!==filterType) return false;
      if(filterStatus!=='all' && e.status!==filterStatus) return false;
      return true;
    }).sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));

    if(filtered.length===0){
      listEl.innerHTML = `<div class="empty"><div class="reel">🎬</div><p>${entries.length===0 ? "Aucun titre pour l'instant. Ajoute le premier film ou série que tu as vu." : "Aucun titre ne correspond à ce filtre."}</p></div>`;
      return;
    }

    filtered.forEach(e=>{
      const card = document.createElement('div');
      card.className = 'ticket' + (e.type==='serie' ? ' serie' : '');
      card.innerHTML = `
        <div class="stripe"></div>
        <div class="ticket-body">
          <div class="ticket-top">
            ${e.posterPath ? `<img class="poster-thumb" src="${TMDB_IMG}${e.posterPath}" alt="" loading="lazy" />` : ''}
            <div style="min-width:0;">
              <div class="ticket-title">${escapeHtml(e.title)}</div>
              <div class="ticket-meta">
                <span class="type-badge">${e.type==='serie'?'Série':'Film'}</span>
                ${e.date ? '<span>· '+fmtDate(e.date)+'</span>' : ''}
              </div>
              <div class="extra-badges">
                ${e.watchedInCinema ? '<span class="xbadge cinema">🎬 Vu au cinéma</span>' : ''}
                ${e.format ? '<span class="xbadge format">'+formatLabel(e.format)+'</span>' : ''}
              </div>
            </div>
          </div>
          ${e.crew ? `<div class="crew-line"><b>${e.type==='serie'?'Créée par':'Réalisé par'}</b> ${escapeHtml(e.crew)}</div>` : ''}
          ${e.cast ? `<div class="crew-line"><b>Avec</b> ${escapeHtml(e.cast)}</div>` : ''}
          ${e.type==='serie' && e.seasons && e.seasons.length ? `<div class="crew-line"><b>Progression</b> ${seasonsSummary(e.seasons)}</div>` : ''}
          ${e.overview ? `<div class="overview">${escapeHtml(e.overview)}</div>` : ''}
          <div class="ticket-actions">
            <button class="icon-btn" data-action="edit" data-id="${e.id}">Modifier</button>
            <button class="icon-btn danger" data-action="delete" data-id="${e.id}">Supprimer</button>
          </div>
        </div>
        <div class="perf"></div>
        <div class="ticket-right">
          <div class="stars">${stars(e.rating)}</div>
          <div class="status-pill ${e.status}">${statusLabel(e.status)}</div>
        </div>
      `;
      listEl.appendChild(card);
    });
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  listEl.addEventListener('click', (ev)=>{
    const btn = ev.target.closest('button[data-action]');
    if(!btn) return;
    const id = btn.dataset.id;
    if(btn.dataset.action==='delete'){
      entries = entries.filter(e=>e.id!==id);
      saveEntries(); render();
    } else if(btn.dataset.action==='edit'){
      openModal(entries.find(e=>e.id===id));
    }
  });

  document.getElementById('typeTabs').addEventListener('click', (ev)=>{
    const t = ev.target.closest('.tab'); if(!t) return;
    filterType = t.dataset.type;
    [...document.getElementById('typeTabs').children].forEach(c=>c.classList.remove('active'));
    t.classList.add('active');
    render();
  });
  document.getElementById('statusTabs').addEventListener('click', (ev)=>{
    const t = ev.target.closest('.tab'); if(!t) return;
    filterStatus = t.dataset.status;
    [...document.getElementById('statusTabs').children].forEach(c=>c.classList.remove('active'));
    t.classList.add('active');
    render();
  });

  document.getElementById('openAdd').addEventListener('click', ()=> openModal(null));

  document.getElementById('resetBtn').addEventListener('click', async ()=>{
    if(entries.length===0) return;
    if(confirm('Supprimer définitivement toute ta collection ?')){
      entries = [];
      await saveEntries();
      render();
    }
  });

  function openModal(entry){
    editingId = entry ? entry.id : null;
    const draft = entry ? {...entry} : {type:'film', status:'a_voir', rating:0, title:'', date:'', watchedInCinema:false, format:'', posterPath:'', overview:'', crew:'', cast:'', tmdbId:null};

    modalRoot.innerHTML = `
      <div class="overlay" id="overlay">
        <div class="sheet">
          <h2>${entry ? 'Modifier le titre' : 'Nouveau titre'}</h2>
          <div class="field search-wrap">
            <label>Rechercher sur TMDB</label>
            <input type="text" id="f_search" autocomplete="off" placeholder="Tape un titre…" />
            <div class="search-results" id="f_results" style="display:none;"></div>
          </div>
          <div id="f_preview"></div>
          <div class="field">
            <label>Titre</label>
            <input type="text" id="f_title" value="${escapeHtml(draft.title)}" placeholder="Ex : Dune, Severance…" />
          </div>
          <div class="field">
            <label>Type</label>
            <div class="seg" id="f_type">
              <button type="button" data-t="film" class="${draft.type==='film'?'sel':''}">Film</button>
              <button type="button" data-t="serie" class="${draft.type==='serie'?'sel':''}">Série</button>
            </div>
          </div>
          <div class="field">
            <label>Statut</label>
            <select id="f_status">
              <option value="a_voir" ${draft.status==='a_voir'?'selected':''}>À voir</option>
              <option value="en_cours" ${draft.status==='en_cours'?'selected':''}>En cours</option>
              <option value="termine" ${draft.status==='termine'?'selected':''}>Terminé</option>
            </select>
          </div>
          <div class="field">
            <label>Note</label>
            <div class="rate-row" id="f_rate">
              ${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" class="${n<=draft.rating?'filled':''}">★</button>`).join('')}
            </div>
          </div>
          <div class="field">
            <label>Date (optionnel)</label>
            <input type="date" id="f_date" value="${draft.date||''}" />
          </div>
          <div class="field serie-only ${draft.type==='serie'?'show':''}" id="f_seasons_field">
            <label>Suivi des saisons</label>
            <div class="tmdb-note" style="margin:0 0 10px;">🟩 Épisode vu &nbsp;·&nbsp; 🟥 Pas encore vu — tape sur un numéro pour basculer.</div>
            <div id="f_seasons_list"></div>
            <div class="add-season-row">
              <input type="number" id="f_new_season_num" placeholder="N° saison" min="1" />
              <input type="number" id="f_new_season_eps" placeholder="Nb épisodes" min="1" />
              <button type="button" id="f_add_season">+ Ajouter</button>
            </div>
          </div>
          <div class="field film-only ${draft.type==='film'?'show':''}" id="f_cinema_field">
            <label>Visionnage</label>
            <div class="switch-row">
              <span>Vu au cinéma</span>
              <button type="button" class="switch ${draft.watchedInCinema?'on':''}" id="f_cinema"></button>
            </div>
          </div>
          <div class="field film-only ${draft.type==='film'?'show':''}" id="f_format_field">
            <label>Je le possède en physique</label>
            <select id="f_format">
              <option value="" ${!draft.format?'selected':''}>Non</option>
              <option value="dvd" ${draft.format==='dvd'?'selected':''}>DVD</option>
              <option value="bluray" ${draft.format==='bluray'?'selected':''}>Blu-ray</option>
              <option value="4k" ${draft.format==='4k'?'selected':''}>4K UHD</option>
            </select>
          </div>
          <div class="sheet-actions">
            <button class="btn ghost" id="f_cancel">Annuler</button>
            <button class="btn primary" id="f_save">${entry ? 'Enregistrer' : 'Ajouter'}</button>
          </div>
        </div>
      </div>
    `;

    let type = draft.type, rating = draft.rating, watchedInCinema = !!draft.watchedInCinema;
    let seasonsState = (draft.seasons || []).map(s=>({number:s.number, episodeCount:s.episodeCount, watched:[...s.watched]}));
    let selected = {
      posterPath: draft.posterPath||'', overview: draft.overview||'',
      crew: draft.crew||'', cast: draft.cast||'', tmdbId: draft.tmdbId||null
    };

    function renderSeasons(){
      const box = modalRoot.querySelector('#f_seasons_list');
      if(!box) return;
      if(seasonsState.length===0){
        box.innerHTML = `<div class="seasons-empty">Aucune saison ajoutée. Cherche la série via TMDB pour les récupérer automatiquement, ou ajoute-en une manuellement ci-dessous.</div>`;
        return;
      }
      const sorted = [...seasonsState].sort((a,b)=>a.number-b.number);
      box.innerHTML = sorted.map(s=>{
        const watchedCount = s.watched.filter(Boolean).length;
        const allDone = watchedCount===s.episodeCount && s.episodeCount>0;
        return `
          <div class="season-block">
            <div class="season-head">
              <span>Saison ${s.number} — ${watchedCount}/${s.episodeCount} vus</span>
              <div class="season-head-actions">
                <button type="button" class="mini-link" data-action="toggle-all" data-season="${s.number}">${allDone?'Décocher tout':'Tout cocher'}</button>
                <button type="button" class="mini-link danger" data-action="remove-season" data-season="${s.number}">✕</button>
              </div>
            </div>
            <div class="ep-grid">
              ${s.watched.map((w,i)=>`<button type="button" class="ep-check ${w?'on':''}" data-action="toggle-ep" data-season="${s.number}" data-ep="${i}">${i+1}</button>`).join('')}
            </div>
          </div>
        `;
      }).join('');
    }
    renderSeasons();

    modalRoot.querySelector('#f_seasons_list').addEventListener('click', (ev)=>{
      const btn = ev.target.closest('button[data-action]'); if(!btn) return;
      const seasonNum = parseInt(btn.dataset.season,10);
      const season = seasonsState.find(s=>s.number===seasonNum);
      if(!season) return;
      if(btn.dataset.action==='toggle-ep'){
        const epIdx = parseInt(btn.dataset.ep,10);
        season.watched[epIdx] = !season.watched[epIdx];
      } else if(btn.dataset.action==='toggle-all'){
        const allDone = season.watched.every(Boolean) && season.episodeCount>0;
        season.watched = season.watched.map(()=>!allDone);
      } else if(btn.dataset.action==='remove-season'){
        seasonsState = seasonsState.filter(s=>s.number!==seasonNum);
      }
      renderSeasons();
    });

    modalRoot.querySelector('#f_add_season').addEventListener('click', ()=>{
      const numInput = modalRoot.querySelector('#f_new_season_num');
      const epsInput = modalRoot.querySelector('#f_new_season_eps');
      const num = parseInt(numInput.value,10);
      const eps = parseInt(epsInput.value,10);
      if(!num || num<1 || !eps || eps<1){
        numInput.focus();
        return;
      }
      if(seasonsState.some(s=>s.number===num)){
        seasonsState = seasonsState.map(s=> s.number===num ? {...s, episodeCount:eps, watched:Array.from({length:eps},(_,i)=>s.watched[i]||false)} : s);
      } else {
        seasonsState.push({number:num, episodeCount:eps, watched:Array(eps).fill(false)});
      }
      numInput.value=''; epsInput.value='';
      renderSeasons();
    });

    function renderPreview(){
      const box = modalRoot.querySelector('#f_preview');
      if(!selected.tmdbId){ box.innerHTML = ''; return; }
      box.innerHTML = `
        <div class="selected-preview">
          ${selected.posterPath ? `<img src="${TMDB_IMG}${selected.posterPath}" alt="" />` : ''}
          <div class="sp-text">
            ${selected.crew ? `<div><b>${type==='serie'?'Créée par':'Réalisé par'}</b> ${escapeHtml(selected.crew)}</div>` : ''}
            ${selected.cast ? `<div><b>Avec</b> ${escapeHtml(selected.cast)}</div>` : ''}
            <button type="button" class="clear-sel" id="f_clear_sel">Retirer les infos TMDB</button>
          </div>
        </div>
      `;
      const clr = box.querySelector('#f_clear_sel');
      if(clr) clr.addEventListener('click', ()=>{
        selected = {posterPath:'', overview:'', crew:'', cast:'', tmdbId:null};
        renderPreview();
      });
    }
    renderPreview();

    let searchTimer = null;
    const searchInput = modalRoot.querySelector('#f_search');
    const resultsBox = modalRoot.querySelector('#f_results');

    async function doSearch(q){
      if(!tmdbApiKey){
        resultsBox.style.display='block';
        resultsBox.innerHTML = `<div class="sr-empty">Ajoute ta clé API TMDB dans les réglages (⚙ en haut) pour activer la recherche.</div>`;
        return;
      }
      if(!q || q.length<2){ resultsBox.style.display='none'; resultsBox.innerHTML=''; return; }
      const endpoint = type==='serie' ? 'tv' : 'movie';
      try{
        const url = `https://api.themoviedb.org/3/search/${endpoint}?api_key=${encodeURIComponent(tmdbApiKey)}&language=fr-FR&query=${encodeURIComponent(q)}`;
        const res = await fetch(url);
        const data = await res.json();
        const results = (data.results||[]).slice(0,8);
        resultsBox.style.display='block';
        if(results.length===0){
          resultsBox.innerHTML = `<div class="sr-empty">Aucun résultat.</div>`;
          return;
        }
        resultsBox.innerHTML = results.map(r=>{
          const title = r.title || r.name || '';
          const dt = r.release_date || r.first_air_date || '';
          const year = dt ? dt.slice(0,4) : '';
          const poster = r.poster_path ? `${TMDB_IMG}${r.poster_path}` : '';
          return `<div class="sr-item" data-id="${r.id}">
            ${poster ? `<img src="${poster}" alt="" />` : '<div class="poster-thumb" style="width:32px;height:48px;"></div>'}
            <div><div class="sr-t">${escapeHtml(title)}</div><div class="sr-y">${year}</div></div>
          </div>`;
        }).join('');
      }catch(e){
        resultsBox.style.display='block';
        resultsBox.innerHTML = `<div class="sr-empty">Erreur de connexion à TMDB.</div>`;
      }
    }

    searchInput.addEventListener('input', (ev)=>{
      clearTimeout(searchTimer);
      const q = ev.target.value.trim();
      searchTimer = setTimeout(()=>doSearch(q), 350);
    });

    resultsBox.addEventListener('click', async (ev)=>{
      const item = ev.target.closest('.sr-item'); if(!item) return;
      const id = item.dataset.id;
      const endpoint = type==='serie' ? 'tv' : 'movie';
      resultsBox.innerHTML = `<div class="sr-empty">Chargement…</div>`;
      try{
        const [detailsRes, creditsRes] = await Promise.all([
          fetch(`https://api.themoviedb.org/3/${endpoint}/${id}?api_key=${encodeURIComponent(tmdbApiKey)}&language=fr-FR`),
          fetch(`https://api.themoviedb.org/3/${endpoint}/${id}/credits?api_key=${encodeURIComponent(tmdbApiKey)}&language=fr-FR`)
        ]);
        const details = await detailsRes.json();
        const credits = await creditsRes.json();

        const title = details.title || details.name || '';
        const dt = details.release_date || details.first_air_date || '';
        let crewNames = '';
        if(endpoint==='movie'){
          crewNames = (credits.crew||[]).filter(c=>c.job==='Director').map(c=>c.name).join(', ');
        } else {
          crewNames = (details.created_by||[]).map(c=>c.name).join(', ');
        }
        const castNames = (credits.cast||[]).slice(0,4).map(c=>c.name).join(', ');

        selected = {
          posterPath: details.poster_path || '',
          overview: details.overview || '',
          crew: crewNames,
          cast: castNames,
          tmdbId: details.id
        };

        if(endpoint==='tv' && Array.isArray(details.seasons)){
          const prev = seasonsState;
          seasonsState = details.seasons.filter(s=>s.season_number>0).map(s=>{
            const old = prev.find(p=>p.number===s.season_number);
            const epCount = s.episode_count || (old?old.episodeCount:0);
            let watched;
            if(old && old.episodeCount===epCount){
              watched = [...old.watched];
            } else if(old){
              watched = Array.from({length:epCount}, (_,i)=> old.watched[i] || false);
            } else {
              watched = Array(epCount).fill(false);
            }
            return {number:s.season_number, episodeCount:epCount, watched};
          });
          renderSeasons();
        }

        modalRoot.querySelector('#f_title').value = title;
        if(dt && !modalRoot.querySelector('#f_date').value){
          modalRoot.querySelector('#f_date').value = dt;
        }
        searchInput.value = '';
        resultsBox.style.display='none';
        resultsBox.innerHTML='';
        renderPreview();
      }catch(e){
        resultsBox.innerHTML = `<div class="sr-empty">Erreur lors du chargement des détails.</div>`;
      }
    });

    document.addEventListener('click', function outsideClick(ev){
      if(!modalRoot.contains(ev.target)) return;
      if(!ev.target.closest('.search-wrap')){
        resultsBox.style.display='none';
      }
    });

    modalRoot.querySelector('#f_type').addEventListener('click', (ev)=>{
      const b = ev.target.closest('button'); if(!b) return;
      type = b.dataset.t;
      [...modalRoot.querySelectorAll('#f_type button')].forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      modalRoot.querySelector('#f_cinema_field').classList.toggle('show', type==='film');
      modalRoot.querySelector('#f_format_field').classList.toggle('show', type==='film');
      modalRoot.querySelector('#f_seasons_field').classList.toggle('show', type==='serie');
    });
    modalRoot.querySelector('#f_cinema').addEventListener('click', (ev)=>{
      watchedInCinema = !watchedInCinema;
      ev.target.classList.toggle('on', watchedInCinema);
    });
    modalRoot.querySelector('#f_rate').addEventListener('click', (ev)=>{
      const b = ev.target.closest('button'); if(!b) return;
      rating = parseInt(b.dataset.n,10);
      [...modalRoot.querySelectorAll('#f_rate button')].forEach(x=>{
        x.classList.toggle('filled', parseInt(x.dataset.n,10) <= rating);
      });
    });
    modalRoot.querySelector('#f_cancel').addEventListener('click', closeModal);
    modalRoot.querySelector('#overlay').addEventListener('click', (ev)=>{
      if(ev.target.id==='overlay') closeModal();
    });
    modalRoot.querySelector('#f_save').addEventListener('click', async ()=>{
      const title = modalRoot.querySelector('#f_title').value.trim();
      if(!title){ modalRoot.querySelector('#f_title').focus(); return; }
      const status = modalRoot.querySelector('#f_status').value;
      const date = modalRoot.querySelector('#f_date').value;
      const format = type==='film' ? modalRoot.querySelector('#f_format').value : '';
      const cinema = type==='film' ? watchedInCinema : false;
      const seasons = type==='serie' ? seasonsState : [];

      if(editingId){
        entries = entries.map(e => e.id===editingId ? {...e, title, type, status, rating, date, format, watchedInCinema:cinema, seasons, ...selected} : e);
      } else {
        entries.push({id:uid(), title, type, status, rating, date, format, watchedInCinema:cinema, seasons, ...selected, createdAt:Date.now()});
      }
      await saveEntries();
      closeModal();
      render();
    });
  }

  function closeModal(){
    modalRoot.innerHTML = '';
    editingId = null;
  }

  loadEntries();
})();
</script>
</body>
</html>
